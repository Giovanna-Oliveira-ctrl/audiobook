<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AUDIOBOOK</title>
  <meta name="description" content="Sua biblioteca pessoal de audiolivros: importe, organize e ouça offline, com reprodução em segundo plano e controles na tela de bloqueio.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#11100e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Audiobook">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    /* Aplica o tema antes da primeira pintura (evita flash claro/escuro). */
    (function () {
      var t = 'auto';
      try { t = localStorage.getItem('audiobook:theme') || 'auto'; } catch (e) {}
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/player.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Pular para o conteúdo</a>

  <div class="app" id="app">
    <aside class="sidebar" aria-label="Navegação principal">

      <nav class="side-nav">

        <a href="#/configuracoes" data-nav="configuracoes"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></svg><span>Configurações</span></a>

      <a class="btn btn--primary side-import" href="#/importar" data-nav="importar"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5V4"/><path d="m7 8.5 5-5 5 5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg><span>Importar audiolivro</span></a>
      <div class="sidebar-footer">
        <span class="net-dot" aria-hidden="true"></span>
        <span id="net-status" aria-live="polite">Biblioteca salva no dispositivo</span>
      </div>
    </aside>

    <main id="view" class="view" tabindex="-1"></main>

    <div id="mini-player" class="mini-player" hidden></div>

    <nav class="tabbar" aria-label="Navegação">
      <a href="#/inicio" data-nav="inicio"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v11a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg><span>Início</span></a>
      <a href="#/biblioteca" data-nav="biblioteca"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="4" height="16" rx="1"/><rect x="9.5" y="4" width="4" height="16" rx="1"/><path d="m15.6 5.4 3.5-.9 3.3 14.2-3.5.9z"/></svg><span>Biblioteca</span></a>
      <a href="#/favoritos" data-nav="favoritos"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.3s-7.6-4.6-9.3-9.4C1.5 7.4 3.8 4.2 7.2 4.2c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.4 0 5.7 3.2 4.5 6.7-1.7 4.8-9.3 9.4-9.3 9.4z"/></svg><span>Favoritos</span></a>
      <a href="#/historico" data-nav="historico"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4.5H8"/><path d="M12 7.5V12l3 2"/></svg><span>Histórico</span></a>
      <a href="#/configuracoes" data-nav="configuracoes"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></svg><span>Ajustes</span></a>
    </nav>
  </div>

  <section id="player" class="player" hidden aria-label="Player"></section>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Elemento de áudio único, fora das telas: a navegação nunca interrompe a reprodução. -->
  <audio id="audio" preload="auto" playsinline></audio>

  <noscript>
    <p style="padding:24px;font-family:system-ui">O AUDIOBOOK precisa de JavaScript ativado.</p>
  </noscript>
</body>
</html>
